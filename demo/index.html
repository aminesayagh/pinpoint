<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pinpoint demo shop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #0f172a; color: white; }
  nav a { color: #cbd5e1; margin-left: 16px; text-decoration: none; }
  main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
  .card button { margin-top: 8px; padding: 8px 12px; border: 0; border-radius: 8px; background: #2563eb; color: white; }
  .promo { background: #fef3c7; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; }
  footer { margin-top: 48px; padding: 24px; background: #f1f5f9; text-align: center; font-size: 14px; }
  dialog { border: 0; border-radius: 12px; box-shadow: 0 10px 40px #0003; }
</style></head>
<body>
<header><strong>Demo Shop</strong><nav><a href="#">Home</a><a href="#">Catalog</a><a href="#">Cart (0)</a></nav></header>
<main>
  <p class="promo">Free shiping on orders over 50 €</p>
  <h1>Our products</h1>
  <div class="grid">
    <div class="card"><h3>Blue mug</h3><p>12,00 €</p><button>Add to cart</button></div>
    <div class="card"><h3>Notebook</h3><p>8,50 €</p><button>Add to cart</button></div>
    <div class="card"><h3>Desk lamp with a very long product name that wraps badly</h3><p>39,90 €</p><button>Add to cart</button></div>
  </div>
  <p><button onclick="document.querySelector('dialog').showModal()">Open newsletter popup</button></p>
  <dialog><h2>Join our newsletter</h2><input placeholder="Email"><button onclick="this.closest('dialog').close()">Subscribe</button></dialog>
</main>
<footer>© 2026 Demo Shop · <a href="#">Terms</a></footer>
</body></html>
